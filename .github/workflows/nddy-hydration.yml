name: NdDy hydration starter validation
on:
  push:
    branches:
      - pilot/phreeqc-nd-dy-2026-10-31
    paths:
      - "simulations/cp2k_hydration/**"
      - "tests/test_cp2k_generator.py"
      - ".github/workflows/nddy-hydration.yml"
  pull_request:
    branches: [main]
    paths:
      - "simulations/cp2k_hydration/**"
      - "tests/test_cp2k_generator.py"
      - ".github/workflows/nddy-hydration.yml"
  workflow_dispatch:
    inputs:
      run_cp2k:
        description: "Run one CP2K DFT single point (Nd3+ plus 8 waters); Actions minutes apply"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate initial coordinates and DFT input structure
        run: |
          python -m unittest discover -s tests -p 'test_cp2k_generator.py' -v
          python simulations/cp2k_hydration/generate.py --out build/hydration --run-type ENERGY
          test "$(find build/hydration -name '*.inp' | wc -l)" -eq 4
      - uses: actions/upload-artifact@v4
        with:
          name: nd-dy-hydration-inputs-not-computed-results
          path: build/hydration/
  cp2k-single-point:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_cp2k)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install CP2K
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cp2k
          command -v cp2k.ssmp || command -v cp2k.psmp || command -v cp2k
      - name: Prepare CP2K data and single test case
        run: |
          mkdir -p build/cp2k
          python simulations/cp2k_hydration/generate.py --out build/cp2k --run-type ENERGY
          DATA_DIR=$(dirname "$(find /usr/share /opt -name LnPP2_POTENTIALS -print -quit)")
          test -f "$DATA_DIR/BASIS_MOLOPT_LnPP2"
          test -f "$DATA_DIR/BASIS_MOLOPT"
          test -f "$DATA_DIR/GTH_POTENTIALS"
          cp "$DATA_DIR/BASIS_MOLOPT_LnPP2" "$DATA_DIR/BASIS_MOLOPT" build/cp2k/
          cat "$DATA_DIR/LnPP2_POTENTIALS" "$DATA_DIR/GTH_POTENTIALS" > build/cp2k/POTENTIALS_COMBINED
      - name: Run one actual CP2K single-point SCF
        working-directory: build/cp2k
        run: |
          set -o pipefail
          CP2K_BIN="$(command -v cp2k.ssmp || command -v cp2k.psmp || command -v cp2k)"
          OMP_NUM_THREADS=2 timeout 420s "$CP2K_BIN" -i nd_w8.inp -o nd_w8.out
          grep "ENERGY| Total FORCE_EVAL" nd_w8.out
          if grep -Eiq '(SCF run NOT converged|SCF did NOT converge)' nd_w8.out; then echo 'SCF nonconverged' >&2; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp2k-nd-w8-initial-singlepoint-log
          path: |
            build/cp2k/nd_w8.out
            build/cp2k/nd_w8.inp
